<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talha - 2048 Game</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="https://i.ibb.co/M6KTWnf/pic.jpg" />
  </head>
  <body>
    <div class="container">
      <div class="info">
        <h1>2048</h1>
        <div class="scores-wrapper">
          <div class="score-container">
            <div class="score-title">SCORE</div>
            <span id="score">0</span>
          </div>
          <div class="score-container">
            <div class="score-title">BEST</div>
            <span id="best-score">0</span>
          </div>
        </div>
      </div>

      <div class="action-bar">
        <span id="result">Join the numbers and get to the <b>2048</b> tile!</span>
        <button id="btn-restart" class="restart-btn">New Game</button>
      </div>

      <div class="grid"></div>

      <div class="controls-hint">
        <span>Use <b>Arrow Keys</b> or <b>WASD</b> | <b>Swipe</b> on mobile</span>
      </div>
    </div>
    <script src="script.js" charset="utf-8"></script>
  </body>
</html>
