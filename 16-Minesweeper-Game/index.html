<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talha - Minesweeper</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="https://i.ibb.co/M6KTWnf/pic.jpg" />
  </head>

  <body>
    <div class="minesweeper-container">
      <div class="game-header">
        <div class="digital-display" id="mines-display">010</div>
        <button id="reset-button" class="face-btn" title="Restart Game">😊</button>
        <div class="digital-display" id="timer-display">000</div>
      </div>

      <div id="board"></div>

      <div class="controls-bar">
        <button id="flag-button" class="tool-btn">🚩 Flag Mode: OFF</button>
        <span class="hint-text">Desktop: Left-click reveal, Right-click flag</span>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
