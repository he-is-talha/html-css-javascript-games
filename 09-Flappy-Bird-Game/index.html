<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Talha - Flappy Bird</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="https://i.ibb.co/M6KTWnf/pic.jpg" />
  </head>
  <body>
    <div class="game-wrapper">
      <div class="header-bar">
        <span>Flappy Bird</span>
        <button id="btn-sound" class="btn-sound" title="Toggle Sound">🔊 Sound</button>
      </div>
      <canvas id="myCanvas" width="620" height="480"></canvas>
      <div class="hints-bar">
        <span>Click, tap, or press Space to flap | 'P' to pause</span>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
